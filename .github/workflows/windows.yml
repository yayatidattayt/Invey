name: Windows verification

on:
  pull_request:
    branches: [main, codex/execution-11-calibration-ci, codex/execution-13-pocket-capture, codex/execution-14-invey-cards-migration, codex/execution-15-workspace-shortcuts-reliability]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Install and verify the pinned x64 SDK
        run: ./scripts/Install-Dotnet.ps1
      - name: Restore locked packages
        run: ./scripts/dotnet.ps1 -Arguments @('restore','Invey.sln','--locked-mode','-p:Platform=x64')
      - name: Build and test Debug and Release
        run: |
          foreach ($configuration in 'Debug','Release') {
            & ./scripts/dotnet.ps1 -Arguments @('build','Invey.sln','-c',$configuration,'-p:Platform=x64','--no-restore')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & ./scripts/dotnet.ps1 -Arguments @('test','tests/Pocket.Core.Tests','-c',$configuration,'--no-build','--logger',"trx;LogFileName=$configuration.trx",'--results-directory','TestResults')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Generate synthetic video and run worker tests
        run: |
          python -m pip install --only-binary=:all: --no-deps --require-hashes -r tests/tracking/requirements-ci.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $encoder = python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $fixture = Join-Path $env:RUNNER_TEMP ("invey-" + [Guid]::NewGuid().ToString("N") + ".mp4")
          try {
            & $encoder -hide_banner -loglevel error -f lavfi -i 'color=c=black:s=640x480:r=10,drawbox=x=0:y=0:w=24:h=24:color=red:t=fill,drawbox=x=0:y=456:w=24:h=24:color=blue:t=fill' -frames:v 6 -an -c:v libx264 -pix_fmt yuv420p $fixture
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $env:GHOST_NATIVE_VIDEO_FIXTURE = $fixture
            python -m unittest discover -s tests/tracking -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            if (Test-Path -LiteralPath $fixture) { Remove-Item -LiteralPath $fixture }
          }
      - name: Describe local acceptance coverage
        if: always()
        run: |
          'CI covers builds, core tests, deterministic worker tests and native Media Foundation file reading from generated test colors. The full WPF/model harness uses local verified fixtures and an isolated desktop. Physical camera, native input and Explorer checks require an authorized Windows test environment.' >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: windows-core-test-results
          path: TestResults/*.trx
          if-no-files-found: warn
          retention-days: 14
