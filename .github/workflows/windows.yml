name: Windows verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install and verify the pinned x64 SDK
        run: ./scripts/Install-Dotnet.ps1
      - name: Restore locked packages
        run: ./scripts/dotnet.ps1 -Arguments @('restore','Pocket.Dual.Ghost.sln','--locked-mode','-p:Platform=x64')
      - name: Build and test Debug and Release
        run: |
          foreach ($configuration in 'Debug','Release') {
            & ./scripts/dotnet.ps1 -Arguments @('build','Pocket.Dual.Ghost.sln','-c',$configuration,'-p:Platform=x64','--no-restore')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & ./scripts/dotnet.ps1 -Arguments @('test','tests/Pocket.Core.Tests','-c',$configuration,'--no-build','--logger',"trx;LogFileName=$configuration.trx",'--results-directory','TestResults')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Run deterministic worker tests
        run: |
          python -m pip install --only-binary=:all: --no-deps --require-hashes -r tests/tracking/requirements-ci.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests/tracking -v
      - name: Describe local acceptance coverage
        if: always()
        run: |
          'CI covers builds, core tests, and deterministic worker tests. Model inference and native file-reader cases use local verified fixtures and an isolated desktop. Physical camera, native input and Explorer checks require an authorized Windows test environment. See VERIFICATION.md.' >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: windows-core-test-results
          path: TestResults/*.trx
          if-no-files-found: warn
          retention-days: 14
